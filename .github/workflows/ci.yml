name: Re-Opt CI

on:
  push:
  pull_request:

jobs:
  test-and-regress:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Run optimization regression gate
        run: python -m reopt.regression --check

      - name: Check adoption explanation freshness
        run: |
          python -m reopt.explain_adoption weights/proposed-seed.json --write-report docs/adoption-analysis/proposed-seed.md --write-smaller-weights weights/proposed-quality-seed.json
          python -m reopt.adopt weights/proposed-seed.json --write-report adoption-reports/proposed-seed.md
          python -m reopt.adopt weights/proposed-quality-seed.json --write-report adoption-reports/proposed-quality-seed.md
          git diff --exit-code docs/adoption-analysis/proposed-seed.md weights/proposed-quality-seed.json adoption-reports/proposed-seed.md adoption-reports/proposed-quality-seed.md

      - name: Check adoption index freshness
        run: |
          python -m reopt.report_index --write docs/adoption-index.md
          git diff --exit-code docs/adoption-index.md

      - name: Check next target freshness
        run: |
          python -m reopt.next_target --write docs/next-target.md
          git diff --exit-code docs/next-target.md
