name: Re-Opt CI

on:
  push:
  pull_request:

jobs:
  test-and-regress:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Run optimization regression gate
        run: python -m reopt.regression --check

      - name: Check adoption explanation freshness
        run: |
          python -m reopt.explain_adoption weights/proposed-seed.json --write-report docs/adoption-analysis/proposed-seed.md
          python -m reopt.adopt weights/proposed-seed.json --write-report adoption-reports/proposed-seed.md
          python -m reopt.adopt weights/proposed-quality-seed.json --write-report adoption-reports/proposed-quality-seed.md
          git diff --exit-code docs/adoption-analysis/proposed-seed.md weights/proposed-quality-seed.json adoption-reports/proposed-seed.md adoption-reports/proposed-quality-seed.md

      - name: Check adoption index freshness
        run: |
          python -m reopt.report_index --write docs/adoption-index.md
          git diff --exit-code docs/adoption-index.md

      - name: Check outcome intake freshness
        run: |
          python -m reopt.outcome_intake --write docs/outcome-intake/next-outcome.md
          git diff --exit-code docs/outcome-intake/next-outcome.md

      - name: Check expanded evidence review freshness
        run: |
          python -m reopt.evidence_review --write-simulated --candidate outcomes/simulated-next-outcome.json --write-weights weights/proposed-expanded-evidence.json --write-report docs/outcome-evidence/simulated-next-outcome.md
          git diff --exit-code outcomes/simulated-next-outcome.json weights/proposed-expanded-evidence.json docs/outcome-evidence/simulated-next-outcome.md

      - name: Check increment cap freshness
        run: |
          python -m reopt.increment_cap weights/proposed-expanded-evidence.json --write-weights weights/proposed-capped-expanded-evidence.json --write-report docs/weight-caps/expanded-evidence.md
          git diff --exit-code weights/proposed-capped-expanded-evidence.json docs/weight-caps/expanded-evidence.md

      - name: Check capped adoption decision freshness
        run: |
          python -m reopt.adoption_decision --write-report docs/adoption-decisions/capped-expanded-evidence.md
          git diff --exit-code docs/adoption-decisions/capped-expanded-evidence.md

      - name: Check next target freshness
        run: |
          python -m reopt.next_target --write docs/next-target.md
          git diff --exit-code docs/next-target.md
