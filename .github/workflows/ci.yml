name: Re-Opt CI

on:
  push:
  pull_request:

jobs:
  test-and-regress:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Run optimization regression gate
        run: python -m reopt.regression --check
